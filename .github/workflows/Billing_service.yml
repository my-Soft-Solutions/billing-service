
name: Billing Service CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "bugfix/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Run Billing Service Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
